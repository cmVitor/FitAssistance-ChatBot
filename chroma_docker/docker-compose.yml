services:
  vectordb:
    image: ghcr.io/chroma-core/chroma:0.4.12
    container_name: chroma_container
    ports:
      - 8000:8000
    env_file:
      - ./.env
    volumes:
      - chromadb_data:/chroma/chroma  # Usa um volume gerenciado pelo Docker
    command: uvicorn chromadb.app:app --reload --workers 1 --host 0.0.0.0 --port 8000 --log-config chromadb/log_config.yml
    restart: unless-stopped

volumes:
  chromadb_data:  # Define o volume gerenciado pelo Docker